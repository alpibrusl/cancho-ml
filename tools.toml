# The authority ceiling of each tool (cancho docs/agent-toolbox.md D12), as in cancho-table: a person writes and reviews this
# file; the authority is whatever `cancho authority` derives from the source (manifests/<tool>.authority.json, embedded in the
# binary and printed by `ml introspect`), and scripts/manifest.py --check fails when a derived label is not allowed here.
# The derived set may be smaller than the ceiling, never larger. No tool may hold ffi, net_out, net_in or clock; `bounded`
# must be true.
#
# `ml` reads the files named on its command line (file_read, fs_read(""): a path from the command line is checked at run time,
# so the row cannot name a directory), writes the model and the log it is told to beneath a directory it opened (dir_write and
# file_write: it can create, append, rename and remove there, and it holds no fs_write, so no path write at all), and keeps
# its working data on the heap. Standard input is read for `predict` only (io_read, below). `conc` arrived with `--threads` at the wiring stage (docs/wiring.md section 6): the
# linear and logistic fits call lib/linalg/par.cho, which spawns threads, in the same diff as the test that no thread count changes a byte
# (tests/conformance/test_determinism.py). A label beyond the base row of lib/models/contract.toml needs a reason in [ml.reasons], and scripts/manifest.py
# refuses one that has none, so the ceiling cannot be widened by editing this list alone.

max_tools = 10

[ml]
allow = ["args", "conc", "dir_read", "dir_write", "err_write", "file_read", "file_write", "fs_read(\"\")", "heap", "io_read", "io_write"]

[ml.reasons]
conc = "fit --threads N: the linear and logistic fits call lib/linalg/par.cho, which spawns the threads of the numeric kernels (lib/models/linear/model.toml and lib/models/logistic/model.toml, [authority] adds). The model file and the answer are the same bytes at every thread count (tests/conformance/test_determinism.py, scripts/admit.py Q6)."
io_read = "predict reads the CSV from standard input for the operand - or no operand: getchar on Io, the label io_read and not a path read of /dev/stdin (docs/serving.md section 2.4). The bytes are kept in memory, up to --max-bytes."

# `ml-predict` (docs/serving.md section 3): predict and describe, from the same sources and its own main. Its row has no write of any kind and no thread: the model
# file and the CSV are read below --root by name, the CSV may come from standard input, and the answer is written to standard output. The base row of
# lib/models/contract.toml is the row of `ml` before any model needed another label; the row here is that row without dir_write and file_write (no log, no
# model written) and with io_read.
[ml-predict]
schema = "ml"
allow = ["args", "dir_read", "err_write", "file_read", "fs_read(\"\")", "heap", "io_read", "io_write"]

[ml-predict.reasons]
io_read = "predict reads the CSV from standard input for the operand - or no operand (docs/serving.md section 2.4)."

# `ml-serve` (docs/serving-http.md section 6): the server of one model file. Its row is the row of `ml-predict` without `io_read` (it reads no standard input), plus what a server of cancho-web
# has: it listens on a port (`net_in`), accepts, reads and writes connections (`conn_accept`, `conn_read`, `conn_write`), waits for them (`poll`) and reads the clock (`clock`).
# No write of any file, no thread, no `exec`, no foreign code, no `net_out`: scripts/manifest.py still refuses those for every tool, and refuses `net_in` and `clock` for every tool whose
# ceiling here does not name them with a reason.
[ml-serve]
schema = "ml"
allow = ["args", "clock", "conn_accept", "conn_read", "conn_write", "dir_read", "err_write", "file_read", "fs_read(\"\")", "heap", "io_write", "net_in(\"\")", "poll"]

[ml-serve.reasons]
net_in = "the server listens on one TCP port: tcp_listen(net, port) is net_in(\"\") (the port is a run-time value). The pinned compiler binds every address of the host, so there is no narrower label (docs/serving-http.md section 5.4)."
conn_accept = "the loop of http.server accepts the connections of that port."
conn_read = "the loop reads the requests of those connections."
conn_write = "the loop writes the answers to those connections."
poll = "the loop waits for the sockets to be ready (a Poller), one thread."
clock = "http.server closes a connection that makes no progress for --idle-seconds, and the access log line carries the milliseconds of the request (cancho-web's users example has the same two uses)."

# `ml-mcp` (docs/mcp.md section 7): `ml` read as a server of the Model Context Protocol. Its row is the row of `ml` and nothing more: it reads and writes the files a call names beneath a directory
# it opened (`fit --output`, `--track`; only with --allow-write), spawns the threads of `fit` and `cv` (`conc`, the same code as `ml`), reads the messages from standard input (`io_read`) and writes the
# answers to standard output. No network, no listener, no clock, no exec, no foreign code.
[ml-mcp]
schema = "ml"
allow = ["args", "conc", "dir_read", "dir_write", "err_write", "file_read", "file_write", "fs_read(\"\")", "heap", "io_read", "io_write"]

[ml-mcp.reasons]
conc = "a call of fit or cv with threads runs the numeric kernels of lib/linalg/par.cho, which spawn threads; the code is the code of ml, and the model file and the answer are the same bytes at every thread count (tests/conformance/test_determinism.py)."
io_read = "the protocol is read from standard input, one line at a time (getchar on Io, the label io_read): the messages of the client, bounded by --max-message-bytes (docs/mcp.md section 5)."
