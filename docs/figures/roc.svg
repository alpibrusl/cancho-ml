<line class="ax" x1="270" y1="290" x2="270" y2="295"/><text class="tk" x="270" y="309" text-anchor="middle">0.75</text>
<line class="ax" x1="340" y1="290" x2="340" y2="295"/><text class="tk" x="340" y="309" text-anchor="middle">1</text>
<text class="lb" x="200" y="328" text-anchor="middle">false positive rate</text>
