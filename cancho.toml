[package]
name = "ml"
cancho = "0207556b4029a3ee73196cdfdb48e8efa7e9c519"   # the compiler these sources were written for

# `contract` is cancho-tools' package, one store per module, pinned to a commit, as in cancho-table (never copied).
# The linear algebra (lib/linalg) and the core (lib/core) import nothing from it; `ml` (tools/ml) does. `cancho install` fetches
# the pinned modules into build/deps (not committed), `cancho build --bin ml` is package mode, and `toolbox.built` is this
# tool's own generated module (generated/ml, written by scripts/manifest.py), as in cancho-table.
# cancho-table's numeric modules that ml imports (flt, facc and reader, and pow5 and dec, which flt imports) are pinned the same way: the
# stores cancho-table commits under .cancho-vcs (PR #44), at one rev, the one docs/reader.md section 1.3 documents (scripts/check_table_pin.sh
# checks that they agree, that no other cancho-table store is listed and that no copy of a module is in this tree). Bumping the rev is the
# act of moving the pin (docs/reader.md section 1.4).

[dependencies.cli]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.cli"

[dependencies.describe]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.describe"

[dependencies.dec]
git = "https://github.com/alpibrusl/cancho-table"
rev = "202b214372a03ec6ed8ca841357f3d2ed4de8aa0"
path = ".cancho-vcs/dec"

[dependencies.facc]
git = "https://github.com/alpibrusl/cancho-table"
rev = "202b214372a03ec6ed8ca841357f3d2ed4de8aa0"
path = ".cancho-vcs/facc"

[dependencies.flt]
git = "https://github.com/alpibrusl/cancho-table"
rev = "202b214372a03ec6ed8ca841357f3d2ed4de8aa0"
path = ".cancho-vcs/flt"

[dependencies.pow5]
git = "https://github.com/alpibrusl/cancho-table"
rev = "202b214372a03ec6ed8ca841357f3d2ed4de8aa0"
path = ".cancho-vcs/pow5"

[dependencies.reader]
git = "https://github.com/alpibrusl/cancho-table"
rev = "202b214372a03ec6ed8ca841357f3d2ed4de8aa0"
path = ".cancho-vcs/reader"

[dependencies.fail]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.fail"

[dependencies.limit]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.limit"

[dependencies.lines]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.lines"

[dependencies.out]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.out"

[dependencies.path]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.path"

[dependencies.place]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.place"

[dependencies.text]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.text"

# `ml-serve` (docs/serving-http.md section 1): cancho-web's `web`, cancho-schema's `schema` and the compiler's `http.server` are pinned stores, one rev each, never copied.
# Only tools/ml-serve imports them (`cancho build --bin ml` and `--bin ml-predict` are the same bytes with or without these blocks: scripts/check_web_pin.py --bins).
# `web` records its requirement on `schema` at the same rev; scripts/check_web_pin.py checks the pins.

[dependencies.web]
git = "https://github.com/alpibrusl/cancho-web"
rev = "5f404a777018cf42b5c713daa4972c938c9229f4"
path = ".cancho-vcs"

[dependencies.schema]
git = "https://github.com/alpibrusl/cancho-schema"
rev = "59a70285ff23af63a226bc56ff978feccb4cf8ca"
path = ".cancho-vcs"

[dependencies.server]
git = "https://github.com/alpibrusl/cancho"
rev = "0207556b4029a3ee73196cdfdb48e8efa7e9c519"
path = "packages/http-server/.cancho-vcs"

[[bin]]
name = "linalg-check"
sources = ["lib/core", "lib/linalg", "tools/linalg-check"]
std = true
out = "build/linalg-check"

# the driver of the numeric gates of lib/models (scripts/gate_models.sh builds it from an explicit file list; `cancho build --bin models-check` builds
# it in package mode too)
[[bin]]
name = "models-check"
sources = ["lib/core", "lib/linalg", "lib/models", "lib/models/linear", "lib/models/kmeans", "tools/models-check"]
std = true
out = "build/models-check"

# the driver of the pure parts of the recommender (scripts/gate_recommend.sh builds it from an explicit file list; `cancho build --bin recommend-check` builds it in package mode too)
[[bin]]
name = "recommend-check"
sources = ["lib/core", "lib/linalg", "lib/metrics", "lib/models/common.cho", "lib/models/recommend", "tools/recommend-check"]
std = true
out = "build/recommend-check"

[[bin]]
name = "ml"
sources = ["lib/core", "lib/linalg", "lib/metrics", "lib/models", "lib/models/boost", "lib/models/kmeans", "lib/models/linear", "lib/models/logistic", "lib/models/recommend", "lib/models/softmax", "lib/models/tree", "lib/models/treewire", "lib/transforms", "lib/pipeline", "tools/ml", "generated/ml"]
std = true
out = "build/ml"

# the prediction half of `ml` (docs/serving.md section 3): the same sources and its own entry point. The files of tools/ml other than its main.cho are listed
# one by one because a directory would bring in the main of `ml`; scripts/check_bins.py fails when this list and the directory disagree.
[[bin]]
name = "ml-predict"
sources = ["lib/core", "lib/linalg", "lib/metrics", "lib/models", "lib/models/boost", "lib/models/kmeans", "lib/models/linear", "lib/models/logistic", "lib/models/recommend", "lib/models/softmax", "lib/models/tree", "lib/models/treewire", "lib/transforms", "lib/pipeline", "tools/ml/app.cho", "tools/ml/argv.cho", "tools/ml/catcli.cho", "tools/ml/catwire.cho", "tools/ml/cfit.cho", "tools/ml/csv.cho", "tools/ml/csvcell.cho", "tools/ml/csvload.cho", "tools/ml/cv.cho", "tools/ml/cvagg.cho", "tools/ml/est.cho", "tools/ml/fitfail.cho", "tools/ml/fitout.cho", "tools/ml/fsio.cho", "tools/ml/idump.cho", "tools/ml/interp.cho", "tools/ml/jsonl.cho", "tools/ml/jsonlcli.cho", "tools/ml/logrec.cho", "tools/ml/mcdata.cho", "tools/ml/mcmetrics.cho", "tools/ml/mcwire.cho", "tools/ml/mdesc.cho", "tools/ml/mfile.cho", "tools/ml/paths.cho", "tools/ml/perm.cho", "tools/ml/prov.cho", "tools/ml/rankcol.cho", "tools/ml/receval.cho", "tools/ml/recflags.cho", "tools/ml/recio.cho", "tools/ml/recload.cho", "tools/ml/recpred.cho", "tools/ml/recsplit.cho", "tools/ml/recwire.cho", "tools/ml/runs.cho", "tools/ml/spec.cho", "tools/ml/splitcol.cho", "tools/ml/splitplan.cho", "tools/ml/splitspec.cho", "tools/ml/splitwire.cho", "tools/ml/track.cho", "tools/ml/verbrun.cho", "tools/ml/verbs.cho", "tools/ml/weightcol.cho", "tools/ml/wire.cho", "tools/ml/wiredata.cho", "tools/ml/wireio.cho", "tools/ml-predict", "generated/ml-predict"]
std = true
out = "build/ml-predict"

# `ml-serve` (docs/serving-http.md section 6): the same sources again and its own entry point, `tools/ml-serve` (the modules of the server and its main). It is the only binary that
# imports the pinned `web`, `schema` and `http.server`. scripts/check_bins.py fails when this list and the directory tools/ml disagree.
[[bin]]
name = "ml-serve"
sources = ["lib/core", "lib/linalg", "lib/metrics", "lib/models", "lib/models/boost", "lib/models/kmeans", "lib/models/linear", "lib/models/logistic", "lib/models/recommend", "lib/models/softmax", "lib/models/tree", "lib/models/treewire", "lib/transforms", "lib/pipeline", "tools/ml/app.cho", "tools/ml/argv.cho", "tools/ml/catcli.cho", "tools/ml/catwire.cho", "tools/ml/cfit.cho", "tools/ml/csv.cho", "tools/ml/csvcell.cho", "tools/ml/csvload.cho", "tools/ml/cv.cho", "tools/ml/cvagg.cho", "tools/ml/est.cho", "tools/ml/fitfail.cho", "tools/ml/fitout.cho", "tools/ml/fsio.cho", "tools/ml/idump.cho", "tools/ml/interp.cho", "tools/ml/jsonl.cho", "tools/ml/jsonlcli.cho", "tools/ml/logrec.cho", "tools/ml/mcdata.cho", "tools/ml/mcmetrics.cho", "tools/ml/mcwire.cho", "tools/ml/mdesc.cho", "tools/ml/mfile.cho", "tools/ml/paths.cho", "tools/ml/perm.cho", "tools/ml/prov.cho", "tools/ml/rankcol.cho", "tools/ml/receval.cho", "tools/ml/recflags.cho", "tools/ml/recio.cho", "tools/ml/recload.cho", "tools/ml/recpred.cho", "tools/ml/recsplit.cho", "tools/ml/recwire.cho", "tools/ml/runs.cho", "tools/ml/spec.cho", "tools/ml/splitcol.cho", "tools/ml/splitplan.cho", "tools/ml/splitspec.cho", "tools/ml/splitwire.cho", "tools/ml/track.cho", "tools/ml/verbrun.cho", "tools/ml/verbs.cho", "tools/ml/weightcol.cho", "tools/ml/wire.cho", "tools/ml/wiredata.cho", "tools/ml/wireio.cho", "tools/ml-serve", "generated/ml-serve"]
std = true
out = "build/ml-serve"

# `ml-mcp` (docs/mcp.md section 7): the same sources again and its own entry point, `tools/ml-mcp`. It also compiles the two files of ml-serve that turn a JSON record into a CSV row
# (cols.cho and num.cho, the same files: the byte rule of docs/serving-http.md section 4), and imports no network module. scripts/check_bins.py fails when this list and the directories disagree.
[[bin]]
name = "ml-mcp"
sources = ["lib/core", "lib/linalg", "lib/metrics", "lib/models", "lib/models/boost", "lib/models/kmeans", "lib/models/linear", "lib/models/logistic", "lib/models/recommend", "lib/models/softmax", "lib/models/tree", "lib/models/treewire", "lib/transforms", "lib/pipeline", "tools/ml/app.cho", "tools/ml/argv.cho", "tools/ml/catcli.cho", "tools/ml/catwire.cho", "tools/ml/cfit.cho", "tools/ml/csv.cho", "tools/ml/csvcell.cho", "tools/ml/csvload.cho", "tools/ml/cv.cho", "tools/ml/cvagg.cho", "tools/ml/est.cho", "tools/ml/fitfail.cho", "tools/ml/fitout.cho", "tools/ml/fsio.cho", "tools/ml/idump.cho", "tools/ml/interp.cho", "tools/ml/jsonl.cho", "tools/ml/jsonlcli.cho", "tools/ml/logrec.cho", "tools/ml/mcdata.cho", "tools/ml/mcmetrics.cho", "tools/ml/mcwire.cho", "tools/ml/mdesc.cho", "tools/ml/mfile.cho", "tools/ml/paths.cho", "tools/ml/perm.cho", "tools/ml/prov.cho", "tools/ml/rankcol.cho", "tools/ml/receval.cho", "tools/ml/recflags.cho", "tools/ml/recio.cho", "tools/ml/recload.cho", "tools/ml/recpred.cho", "tools/ml/recsplit.cho", "tools/ml/recwire.cho", "tools/ml/runs.cho", "tools/ml/spec.cho", "tools/ml/splitcol.cho", "tools/ml/splitplan.cho", "tools/ml/splitspec.cho", "tools/ml/splitwire.cho", "tools/ml/track.cho", "tools/ml/verbrun.cho", "tools/ml/verbs.cho", "tools/ml/weightcol.cho", "tools/ml/wire.cho", "tools/ml/wiredata.cho", "tools/ml/wireio.cho", "tools/ml-serve/cols.cho", "tools/ml-serve/num.cho", "tools/ml-mcp", "generated/ml-mcp"]
std = true
out = "build/ml-mcp"

# the driver of the number gate of ml-serve (tests/conformance/test_serve_json.py, docs/serving-http.md gate S3): the cell tools/ml-serve/num.cho makes for a number, for a script to compare with Python.
[[bin]]
name = "serve-check"
sources = ["tools/ml-serve/num.cho", "tools/serve-check"]
std = true
out = "build/serve-check"

# the driver of the JSON lines gates (tests/conformance/test_jsonl_oracle.py, test_jsonl_fuzz.py; docs/jsonl.md section 6): the CSV tools/ml/jsonl.cho makes of a file of JSON lines, for a script to compare with Python's json.
[[bin]]
name = "jsonl-check"
sources = ["lib/core", "lib/linalg/tensor.cho", "tools/ml/argv.cho", "tools/ml/jsonl.cho", "tools/ml/fsio.cho", "tools/ml/paths.cho", "tools/jsonl-check"]
std = true
out = "build/jsonl-check"
