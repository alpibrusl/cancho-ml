[[bin]]
name = "linalg-check"
sources = ["lib/core", "lib/linalg", "tools/linalg-check"]
std = true
out = "build/linalg-check"

# the driver of the numeric gates of lib/models (scripts/gate_models.sh builds it from an explicit file list; this entry was not built in
# package mode, which needs `cancho install`)
[[bin]]
name = "models-check"
sources = ["lib/core", "lib/linalg", "lib/models", "lib/models/linear", "lib/models/kmeans", "tools/models-check"]
std = true
out = "build/models-check"

[[bin]]
name = "ml"
sources = ["lib/core", "lib/linalg", "lib/metrics", "lib/models", "lib/models/kmeans", "lib/models/linear", "lib/models/logistic", "lib/models/tree", "lib/models/treewire", "lib/transforms", "lib/pipeline", "tools/ml", "generated/ml"]
std = true
out = "build/ml"
