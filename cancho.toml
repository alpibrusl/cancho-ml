[package]
name = "ml"
cancho = "a4572ea3b506e4bcec1c4be43deda1043c11ba9f"   # the compiler these sources were written for

# `contract` is cancho-tools' package, one store per module, pinned to a commit, as in cancho-table (never copied).
# The linear algebra (lib/linalg) and the core (lib/core) import nothing from it; `ml` (tools/ml) does. `cancho install` fetches
# the pinned modules into build/deps (not committed), `cancho build --bin ml` is package mode, and `toolbox.built` is this
# tool's own generated module (generated/ml, written by scripts/manifest.py), as in cancho-table.
# cancho-table is NOT a dependency: it is a binary, not a package, and its float reader (tools/table/flt.cho) is unmerged;
# tools/ml/csv.cho is this slice's own small reader (docs/cli.md section 2.3).

[dependencies.cli]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.cli"

[dependencies.describe]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.describe"

[dependencies.fail]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.fail"

[dependencies.limit]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.limit"

[dependencies.lines]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.lines"

[dependencies.out]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.out"

[dependencies.path]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.path"

[dependencies.place]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.place"

[dependencies.text]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.text"

[[bin]]
name = "linalg-check"
sources = ["lib/core", "lib/linalg", "tools/linalg-check"]
std = true
out = "build/linalg-check"

# the driver of the numeric gates of lib/models (scripts/gate_models.sh builds it from an explicit file list; this entry was not built in
# package mode, which needs `cancho install`)
[[bin]]
name = "models-check"
sources = ["lib/core", "lib/linalg", "lib/models", "lib/models/linear", "lib/models/kmeans", "tools/models-check"]
std = true
out = "build/models-check"

[[bin]]
name = "ml"
sources = ["lib/core", "tools/ml", "generated/ml"]
std = true
out = "build/ml"
