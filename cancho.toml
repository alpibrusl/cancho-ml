[package]
name = "ml"
cancho = "a4572ea3b506e4bcec1c4be43deda1043c11ba9f"   # the compiler these sources were written for

# `contract` is cancho-tools' package, one store per module, pinned to a commit, as in cancho-table (never copied).
# The linear algebra (lib/linalg) and the core (lib/core) import nothing from it; `ml` (tools/ml) does. `cancho install` fetches
# the pinned modules into build/deps (not committed), `cancho build --bin ml` is package mode, and `toolbox.built` is this
# tool's own generated module (generated/ml, written by scripts/manifest.py), as in cancho-table.
# cancho-table's numeric modules (pow5, dec, flt, query, facc, reader) are pinned the same way: the stores cancho-table commits under
# .cancho-vcs (PR #44), at one rev, the one docs/reader.md section 1.3 documents (scripts/check_table_pin.sh checks that they agree and
# that no copy of a module is in this tree). Bumping the rev is the act of moving the pin (docs/reader.md section 1.4).

[dependencies.cli]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.cli"

[dependencies.describe]
git = "https://github.com/alpibrusl/cancho-tools"
rev = "8dab9176e521660333914dc768a80a29330a2a8e"
path = ".cancho-vcs/toolbox.describe"

[dependencies.dec]
git = "https://github.com/alpibrusl/cancho-table"
rev = "202b214372a03ec6ed8ca841357f3d2ed4de8aa0"
path = ".cancho-vcs/dec"

[dependencies.facc]
git = "https://github.com/alpibrusl/cancho-table"
rev = "202b214372a03ec6ed8ca841357f3d2ed4de8aa0"
