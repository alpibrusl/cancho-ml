# Softmax (multinomial logistic) regression by Newton's method with the full block Hessian, a fixed number of iterations, optional l2 (docs/multiclass.md section 3).
# Stage B1: the library only (wired = false); the wiring into the verbs, the file payload and the answers are stage B2.
name = "softmax"
kind = 9
kind_fn = "model_softmax"
task = "classification"
tier = "experimental"
wired = false
payload_version = 1
doc = "docs/multiclass.md"
files = ["lib/models/softmax/softmax.cho", "lib/models/softmax/spass.cho", "lib/models/rank.cho"]
plan_order = 7

[limits]
max_features = 256
max_iterations = 1000
max_classes = 64
max_parameters = 2048

[tags]
emits = [
  "ml.tensor.rank", "ml.tensor.shape", "ml.tensor.bounds", "ml.input.non-finite", "ml.input.too-many-columns", "ml.param.out-of-range",
  "ml.linalg.not-positive-definite", "ml.linalg.singular", "ml.param.threads", "ml.fit.non-finite", "ml.fit.collinear", "ml.fit.separable", "ml.label.single-class",
  "ml.limit.classes", "ml.limit.parameters",
]

[authority]
adds = ["conc"]
reason = "lib/linalg/par.cho spawns the threads of fit --threads N, as the binary model"

[sums]
decisive = ["lib/models/softmax/spass.cho", "lib/models/softmax/softmax.cho"]

[oracle]
script = "scripts/oracle_models.py"
args = "softmax"
tolerance = "bits"

[[hyperparameter]]
name = "iterations"
type = "int"
min = 1
max = 1000
default = "100"
doc = "the Newton iterations, a fixed number: 1 to 1000"

[[hyperparameter]]
name = "l2"
type = "float"
nonneg = true
default = "0.0"
doc = "the ridge penalty, a finite number, 0 or more. The intercepts are not penalised"
