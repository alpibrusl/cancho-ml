# A decision tree (docs/models-tree.md), wired into the verbs by docs/wiring-trees.md. Shares kind 7 with the forest (the task is a field of the payload). A tree is
# a forest of one tree with no bootstrap and every feature tried at every node; the flags it does not have are fixed by its adapter.
name = "tree"
kind = 7
kind_fn = "model_tree"
shares_kind_with = "forest"
task = "both"
tier = "experimental"
wired = true
shape = "blob"
adapter = "models.adapter_tree"
payload_version = 2
doc = "docs/models-tree.md"
files = ["lib/models/tree/model.cho", "lib/models/tree/grow.cho", "lib/models/tree/adapter.cho", "lib/models/tree/adapt.cho"]
plan_order = 4

[limits]
max_rows = 1048576
max_nodes_per_tree = 4194304
max_depth = 30

[tags]
emits = [
  "ml.input.empty", "ml.input.too-many-rows", "ml.input.too-many-columns", "ml.input.too-many-cells", "ml.input.non-finite", "ml.label.not-binary", "ml.label.single-class",
  "ml.limit.depth", "ml.limit.nodes", "ml.param.out-of-range", "ml.param.threads", "ml.model.truncated", "ml.model.malformed", "ml.schema.mismatch",
]

[authority]
adds = []
reason = ""

[sums]
decisive = []
# float sums made in a fixed sequential order, not through linalg.order: the regression sums of the split search and the aggregation over the trees (docs/models-tree.md
# sections 2.6 and 3.2). A file of kind 7 records sum_order 3 for exactly this reason (docs/wiring-trees.md section 4).
sequential = ["lib/models/tree/grow.cho", "lib/models/tree/predict.cho"]

[oracle]
script = "scripts/oracle_wire_tree.py"
args = "tree"
tolerance = "bits"

[[hyperparameter]]
name = "task"
type = "enum"
values = ["classification", "regression"]
required = true
doc = "classification or regression: set with --task, default regression"

[[hyperparameter]]
name = "max-depth"
type = "int"
min = 1
max = 1000
default = "8"
doc = "the deepest tree: 1 to 1000 are accepted and a depth above 30 is refused with ml.limit.depth"

[[hyperparameter]]
name = "min-leaf"
type = "int"
min = 1
max = 1000000
default = "1"
doc = "the fewest rows in a leaf"

[[hyperparameter]]
name = "bins"
type = "int"
min = 2
max = 255
default = "64"
doc = "the quantile bins of the split search"

[[hyperparameter]]
name = "max-nodes"
type = "int"
min = 1
max = 999999999
default = "4194304"
doc = "the most nodes one tree may have: above 4194304 or more than the tree needs is ml.limit.nodes, a tree is never cut"
