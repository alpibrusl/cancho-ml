# A decision tree (docs/models-tree.md): a library, not wired into the verbs in this stage. Shares kind 7 with the forest (the task is a field of the payload).
name = "tree"
kind = 7
kind_fn = "model_tree"
shares_kind_with = "forest"
task = "classification"
tier = "experimental"
wired = false
payload_version = 1
doc = "docs/models-tree.md"
files = ["lib/models/tree/model.cho", "lib/models/tree/grow.cho"]
plan_order = 4

[tags]
emits = ["ml.input.non-finite", "ml.label.not-binary", "ml.label.single-class", "ml.limit.depth", "ml.limit.nodes", "ml.model.truncated", "ml.model.malformed", "ml.schema.mismatch"]

[authority]
adds = []
reason = ""

[sums]
decisive = []

[[hyperparameter]]
name = "task"
type = "enum"
values = ["classification", "regression"]
required = true
doc = "classification or regression"

[[hyperparameter]]
name = "max-depth"
type = "int"
min = 1
max = 30
default = "8"
doc = "the deepest tree"

[[hyperparameter]]
name = "min-leaf"
type = "int"
min = 1
max = 1000000
default = "1"
doc = "the fewest rows in a leaf"
