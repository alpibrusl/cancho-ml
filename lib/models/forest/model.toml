# A random forest (docs/models-tree.md): a library, not wired into the verbs in this stage. Shares kind 7 with the tree.
name = "forest"
kind = 7
kind_fn = "model_tree"
shares_kind_with = "tree"
task = "classification"
tier = "experimental"
wired = false
payload_version = 1
doc = "docs/models-tree.md"
files = ["lib/models/tree/forest.cho"]
plan_order = 5

[tags]
emits = ["ml.input.non-finite", "ml.label.not-binary", "ml.label.single-class", "ml.limit.depth", "ml.limit.nodes", "ml.param.threads"]

[authority]
adds = []
reason = ""

[sums]
decisive = []

[[hyperparameter]]
name = "task"
type = "enum"
values = ["classification", "regression"]
required = true
doc = "classification or regression"

[[hyperparameter]]
name = "trees"
type = "int"
min = 1
max = 1024
default = "100"
doc = "the number of trees"

[[hyperparameter]]
name = "max-depth"
type = "int"
min = 1
max = 30
default = "8"
doc = "the deepest tree"

[[hyperparameter]]
name = "min-leaf"
type = "int"
min = 1
max = 1000000
default = "1"
doc = "the fewest rows in a leaf"
