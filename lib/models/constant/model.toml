# The constant model: the training mean, or the majority class (docs/cli.md section 3). It is not an adapter: tools/ml/verbs.cho and mfile.cho build it,
# exactly, with no float order, and its files are the bytes of the CLI slice. The manifest holds its kinds and its plan keys.
name = "constant"
kind = 1
extra_kinds = [2, 3]
kind_fn = "model_const_regression"
task = "regression"
tier = "supported"
wired = true
adapter = "builtin"
payload_version = 1
doc = "docs/cli.md"
files = ["tools/ml/mfile.cho"]
plan_order = 0

[tags]
emits = ["ml.label.single-class", "ml.label.not-binary", "ml.label.not-integer", "ml.metric.undefined", "ml.model.malformed"]

[authority]
adds = []
reason = ""

[sums]
decisive = []

[oracle]
script = "tests/conformance/test_oracle.py"
args = ""
tolerance = "exact rationals (fractions.Fraction), docs/cli.md section 3"

[[hyperparameter]]
name = "task"
type = "enum"
values = ["regression", "classification"]
required = true
doc = "regression or classification"
